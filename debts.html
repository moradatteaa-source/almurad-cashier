<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الديون</title>

<style>
:root{
  --blue:#043B64;
  --orange:#FF6B2D;
  --bg:#f4f6fa;
  --red:#c0392b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tajawal, Tahoma, sans-serif;
  background:var(--bg);
}
header{
  background:var(--blue);
  color:white;
  padding:16px;
  text-align:center;
  font-size:18px;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:12px;
}
.customer{
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:16px;
  border:1px solid #ddd;
}
.cHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.name{
  font-size:17px;
  font-weight:bold;
  color:var(--blue);
}
.phone{
  font-size:13px;
  color:#555;
}
.totalDebt{
  color:var(--red);
  font-weight:bold;
  font-size:16px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:13px;
}
th,td{
  border:1px solid #eee;
  padding:6px;
  text-align:center;
}
th{
  background:#f1f4f7;
}
.payBox{
  margin-top:10px;
  display:flex;
  gap:10px;
}
.payBox input{
  flex:1;
  padding:8px;
  border-radius:8px;
  border:1px solid #ccc;
}
.payBox button{
  padding:8px 16px;
  border:none;
  border-radius:8px;
  background:var(--orange);
  color:white;
  font-size:14px;
  cursor:pointer;
}
.empty{
  text-align:center;
  margin-top:40px;
  color:#777;
}
</style>
</head>

<body>

<header>📄 الديون (مجمّعة حسب الزبون)</header>

<div class="container" id="list"></div>

<script>
// أدوات
const f = n => Number(n || 0).toLocaleString("en-US") + " د.ع";

// قراءة الفواتير
let invoices = JSON.parse(localStorage.getItem("invoices") || "[]");

// فلترة الديون فقط
const debtInvoices = invoices.filter(
  i => i.payType === "دين" && i.rest > 0 && i.debtor
);

// تجميع حسب رقم الهاتف
const customers = {};
debtInvoices.forEach(inv => {
  const phone = inv.debtor.phone || "بدون";
  if (!customers[phone]) {
    customers[phone] = {
      name: inv.debtor.name,
      phone,
      invoices: [],
      total: 0
    };
  }
  customers[phone].invoices.push(inv);
  customers[phone].total += inv.rest;
});

const list = document.getElementById("list");

if (Object.keys(customers).length === 0) {
  list.innerHTML = `<div class="empty">ماكو ديون مسجلة</div>`;
} else {
  Object.values(customers).forEach(cust => {
    const div = document.createElement("div");
    div.className = "customer";

    let invoicesHTML = "";

    cust.invoices.forEach(inv => {
      let itemsRows = "";
      inv.items.forEach(it => {
        itemsRows += `
          <tr>
            <td>${it.product}</td>
            <td>${it.qty}</td>
            <td>${f(it.price)}</td>
            <td>${f(it.total)}</td>
          </tr>
        `;
      });

      invoicesHTML += `
        <div style="margin-top:10px;border-top:1px dashed #ccc;padding-top:10px">
          <div style="font-weight:bold;margin-bottom:5px">
            🧾 فاتورة #${inv.invoiceNo} — ${inv.date}
          </div>

          <table>
            <tr>
              <th>المنتج</th>
              <th>الكمية</th>
              <th>السعر</th>
              <th>المجموع</th>
            </tr>
            ${itemsRows}
          </table>

          <div style="text-align:left;margin-top:6px;color:#c0392b;font-weight:bold">
            المتبقي على الفاتورة: ${f(inv.rest)}
          </div>
        </div>
      `;
    });

    div.innerHTML = `
      <div class="cHeader">
        <div>
          <div class="name">${cust.name}</div>
          <div class="phone">${cust.phone}</div>
        </div>
        <div class="totalDebt">${f(cust.total)}</div>
      </div>

      ${invoicesHTML}

      <div class="payBox">
        <input type="number" placeholder="مبلغ التسديد" id="pay-${cust.phone}">
        <button onclick="pay('${cust.phone}')">تسديد</button>
      </div>
    `;

    list.appendChild(div);
  });
}

// دالة التسديد (FIFO)
function pay(phone) {
  const input = document.getElementById("pay-" + phone);
  let amount = Number(input.value || 0);
  if (amount <= 0) {
    alert("أدخل مبلغ صحيح");
    return;
  }

  const invs = invoices
    .filter(
      i =>
        i.payType === "دين" &&
        i.debtor &&
        i.debtor.phone === phone &&
        i.rest > 0
    )
    .sort((a, b) => new Date(a.date) - new Date(b.date));

  for (let inv of invs) {
    if (amount <= 0) break;

    if (amount >= inv.rest) {
      amount -= inv.rest;
      inv.paid += inv.rest;
      inv.rest = 0;
    } else {
      inv.paid += amount;
      inv.rest -= amount;
      amount = 0;
    }
  }

  localStorage.setItem("invoices", JSON.stringify(invoices));
  alert("تم التسديد ✅");
  location.reload();
}
</script>


</body>
</html>
