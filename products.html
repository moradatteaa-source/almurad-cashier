<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>المنتجات</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
    
:root{
  --blue:#043B64;
  --orange:#FF6B2D;
  --bg:#f4f6fa;
}
body{
  margin:0;
  font-family:Tahoma;
  background:var(--bg);
}
header{
  background:var(--blue);
  color:white;
  padding:12px;
  text-align:center;
  font-size:18px;
}
.container{
  padding:10px;
}
table{
  width:100%;
  background:white;
  border-collapse:collapse;
}
th,td{
  border:1px solid #ddd;
  padding:6px;
  text-align:center;
}
th{
  background:#eaf0f6;
}
input{
  width:100%;
  border:none;
  text-align:center;
}
button{
  padding:6px 10px;
  background:var(--orange);
  color:white;
  border:none;
  border-radius:4px;
}
.delete{
  background:#c0392b;
}
/* منع التقريب التلقائي عند الضغط على الحقول */
input,
select,
textarea {
  font-size: 16px !important;
  -webkit-text-size-adjust: 100%;
}

/* تحسين سلوك اللمس ومنع zoom غير مرغوب */
html, body {
  touch-action: manipulation;
}

</style>
</head>

<body>

<header>🏬 المخزن</header>
<div class="container" style="
  background:white;
  margin:10px;
  border-radius:8px;
  display:flex;
  gap:10px;
  align-items:center;
">
  <input 
    type="file" 
    id="excelFile" 
    accept=".xlsx,.xls"
    style="flex:1"
  >
  <button onclick="importExcel()">📥 استيراد من Excel</button>
</div>

<div class="container">
<table id="productsTable">
<tr>
  <th>المنتج</th>
  <th>سعر الشراء</th>
  <th>سعر البيع</th>
  <th>الكمية</th>
  <th>حذف</th>
</tr>
</table>

<br>
<button onclick="addRow()">➕ إضافة منتج</button>
</div>


<script>
const table = document.getElementById("productsTable");
let products = JSON.parse(localStorage.getItem("products") || "[]");

function render(){
  table.innerHTML = `
  <tr>
    <th>المنتج</th>
    <th>سعر الشراء</th>
    <th>سعر البيع</th>
    <th>الكمية</th>
    <th>حذف</th>
  </tr>`;
  products.forEach((p,i)=>{
    const r = table.insertRow();
    r.innerHTML = `
      <td><input value="${p.name}" onchange="update(${i},'name',this.value)"></td>
      <td><input type="number" value="${p.buy}" onchange="update(${i},'buy',this.value)"></td>
      <td><input type="number" value="${p.sell}" onchange="update(${i},'sell',this.value)"></td>
      <td><input type="number" value="${p.qty}" onchange="update(${i},'qty',this.value)"></td>
      <td><button class="delete" onclick="remove(${i})">✖</button></td>
    `;
  });
}

function addRow(){
  products.push({name:"",buy:0,sell:0,qty:0});
  save();
}

function update(i,key,val){
  products[i][key]=val;
  save();
}

function remove(i){
  products.splice(i,1);
  save();
}

function save(){
  localStorage.setItem("products",JSON.stringify(products));
  render();
}

render();
function importExcel(){
  const fileInput = document.getElementById("excelFile");
  if(!fileInput.files.length){
    alert("اختر ملف Excel أولاً");
    return;
  }

  const file = fileInput.files[0];
  const reader = new FileReader();

  reader.onload = function(e){
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, {type: "array"});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1});

    // حذف الهيدر
    rows.shift();

    rows.forEach(r=>{
      if(!r[0]) return;

      products.push({
        name: r[0] || "",
        buy: Number(r[1]) || 0,
        sell: Number(r[2]) || 0,
        qty: Number(r[3]) || 0
      });
    });

    save();
    fileInput.value = "";
    alert("تم استيراد المنتجات بنجاح ✅");
  };

  reader.readAsArrayBuffer(file);
}

</script>

</body>
</html>
