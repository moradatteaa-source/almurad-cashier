<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأرباح</title>

<style>
:root{
  --blue:#043B64;
  --orange:#FF6B2D;
  --bg:#f4f6fa;
}
body{
  margin:0;
  font-family:Tahoma;
  background:var(--bg);
}
header{
  background:var(--blue);
  color:white;
  padding:12px;
  text-align:center;
  font-size:18px;
}
.container{padding:10px;}
.box{
  background:white;
  padding:10px;
  margin-bottom:10px;
  border-radius:6px;
}
label{font-size:13px}
input,button{
  padding:6px;
  margin:4px 0;
}
button{
  background:var(--orange);
  color:white;
  border:none;
  border-radius:4px;
  cursor:pointer;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
  margin-top:10px;
}
th,td{
  border:1px solid #ddd;
  padding:6px;
  text-align:center;
}
th{background:#eaf0f6;}
.total{
  font-size:16px;
  font-weight:bold;
  color:var(--orange);
  text-align:center;
  margin-top:10px;
}
</style>
</head>

<body>

<header>💰 الأرباح</header>

<div class="container">

<div class="box">
  <label>من تاريخ:</label>
  <input type="date" id="from">
  <label>إلى تاريخ:</label>
  <input type="date" id="to">
  <br>
  <button onclick="calcProfit()">📊 عرض الأرباح</button>
</div>

<div class="box">
<table id="table">
  <tr>
    <th>التاريخ</th>
    <th>المنتج</th>
    <th>الكمية</th>
    <th>إجمالي البيع</th>
    <th>إجمالي الشراء</th>
    <th>الربح</th>
  </tr>
</table>

<div id="netProfit" class="total">صافي الربح: 0 د.ع</div>
</div>

</div>

<script>
// 🔗 ربط مع الكاشير والمخزن
const invoices = JSON.parse(localStorage.getItem("invoices") || "[]");
const products = JSON.parse(localStorage.getItem("products") || "[]");

const table = document.getElementById("table");
const netProfitEl = document.getElementById("netProfit");

function getBuyPrice(name){
  const p = products.find(x => x.name.trim() === name.trim());
  return p ? Number(p.buy) : 0;
}

function calcProfit(){
  const from = document.getElementById("from").value;
  const to   = document.getElementById("to").value;

  table.innerHTML = `
    <tr>
      <th>التاريخ</th>
      <th>المنتج</th>
      <th>الكمية</th>
      <th>إجمالي البيع</th>
      <th>إجمالي الشراء</th>
      <th>الربح</th>
    </tr>
  `;

  let netProfit = 0;
  let found = false;

  invoices.forEach(inv=>{
    if(from && inv.date < from) return;
    if(to && inv.date > to) return;
    if(!inv.items) return;

    inv.items.forEach(it=>{
      const buyPrice = getBuyPrice(it.product);
      const sellTotal = Number(it.total);
      const buyTotal  = buyPrice * Number(it.qty);
      const profit    = sellTotal - buyTotal;

      netProfit += profit;
      found = true;

      const r = table.insertRow();
      r.innerHTML = `
        <td>${inv.date}</td>
        <td>${it.product}</td>
        <td>${it.qty}</td>
        <td>${sellTotal.toLocaleString("en-US")} د.ع</td>
        <td>${buyTotal.toLocaleString("en-US")} د.ع</td>
        <td>${profit.toLocaleString("en-US")} د.ع</td>
      `;
    });
  });

  if(!found){
    const r = table.insertRow();
    r.innerHTML = `<td colspan="6">لا توجد بيانات ضمن هذه الفترة</td>`;
    netProfitEl.textContent = "صافي الربح: 0 د.ع";
    return;
  }

  netProfitEl.textContent =
    "صافي الربح: " + netProfit.toLocaleString("en-US") + " د.ع";
}
</script>

</body>
</html>
